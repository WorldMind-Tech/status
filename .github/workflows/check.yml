# Every 15 minutes, off the hour (GitHub delays or drops schedules at busy times, the top of the hour most): check the platform and the docs, keep the result in data/status.json, open or close the incident issue.
# Commits made with the workflow's own token do not start other workflows, so the page is not redeployed for them: it reads
# data/status.json straight from the repository.
name: check

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 status.py
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet && exit 0
          git commit -q -m "check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
